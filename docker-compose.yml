services:
  db:
    image: postgres:17-alpine
    container_name: diet-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-diet_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - diet-tracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-diet_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  diet-tracker-db-data:
